<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{salon/base :: head}"></head>
    <body>

        <nav th:replace="~{salon/base :: navbar}"></nav>
        <header th:replace="~{salon/base :: header}"></header>

        <div class="container mt-4">
            <h2>Modificar Categoría</h2>

            <form th:action="@{/categoria/guardar}" method="post" th:object="${categoria}" class="row g-2">
                <input type="hidden" th:field="*{id}"/>
                <div class="col-md-8">
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100">Guardar</button>
                </div>
            </form>

            <div class="mt-3">
                <a th:href="@{/categoria/listado}">Volver</a>
            </div>
        </div>

        <footer th:replace="~{salon/base :: footer}"></footer>
    </body>
</html>
