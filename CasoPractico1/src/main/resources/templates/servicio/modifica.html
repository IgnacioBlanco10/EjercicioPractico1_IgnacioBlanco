<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{salon/base :: head}"></head>
    <body>

        <nav th:replace="~{salon/base :: navbar}"></nav>
        <header th:replace="~{salon/base :: header}"></header>

        <div class="container mt-4">
            <h2>Modificar Servicio</h2>

            <form th:action="@{/servicio/guardar}" method="post" th:object="${servicio}" class="row g-2">
                <input type="hidden" th:field="*{id}"/>

                <div class="col-md-5">
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="col-md-3">
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <select th:field="*{categoria.id}" class="form-select" required>
                        <option value="" disabled selected>Seleccione categoría</option>
                        <option th:each="c : ${categorias}"
                                th:value="${c.id}"
                                th:text="${c.nombre}">
                        </option>
                    </select>
                </div>

                <div class="col-12 mt-2">
                    <button class="btn btn-primary">Guardar</button>
                    <a class="btn btn-link" th:href="@{/servicio/listado}">Volver</a>
                </div>
            </form>
        </div>

        <footer th:replace="~{salon/base :: footer}"></footer>
    </body>
</html>
