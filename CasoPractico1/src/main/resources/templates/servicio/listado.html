<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{salon/base :: head}"></head>
    <body>

        <nav th:replace="~{salon/base :: navbar}"></nav>
        <header th:replace="~{salon/base :: header}"></header>

        <div class="container mt-4">
            <h2>Servicios</h2>

            <form th:action="@{/servicio/guardar}" method="post" th:object="${servicio}" class="row g-2">
                <input type="hidden" th:field="*{id}"/>

                <div class="col-md-4">
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre del servicio" required>
                </div>

                <div class="col-md-3">
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" placeholder="Precio" required>
                </div>

                <div class="col-md-3">
                    <select th:field="*{categoria.id}" class="form-select" required>
                        <option value="" disabled selected>Seleccione categoría</option>
                        <option th:each="c : ${categorias}"
                                th:value="${c.id}"
                                th:text="${c.nombre}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-success w-100">Guardar</button>
                </div>
            </form>

            <hr>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Servicio</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th style="width:180px;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${servicios}">
                        <td th:text="${s.nombre}"></td>
                        <td th:text="${s.precio}"></td>
                        <td th:text="${s.categoria.nombre}"></td>
                        <td>
                            <a class="btn btn-warning btn-sm"
                               th:href="@{/servicio/modificar/{id}(id=${s.id})}">Editar</a>
                            <a class="btn btn-danger btn-sm"
                               th:href="@{/servicio/eliminar/{id}(id=${s.id})}">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer th:replace="~{salon/base :: footer}"></footer>
    </body>
</html>
