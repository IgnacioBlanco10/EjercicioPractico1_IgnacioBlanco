<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8">
        <title>Salón de Belleza</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav th:fragment="navbar" class="navbar navbar-expand-lg" style="background-color: #ff4da6;">
            <div class="container-fluid">

                <a class="navbar-brand text-white" th:href="@{/}">Salón</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/}">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/categoria/listado}">Categorías</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/servicio/listado}">Servicios</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/reserva/listado}">Reservas</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/contacto}">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <header th:fragment="header" class="bg-light border-bottom">
            <div class="container py-3">
                <h3 class="m-0">Gestión del Salón</h3>
            </div>
        </header>

        <footer th:fragment="footer" class="mt-5 text-white"
                style="background-color: #2c2c2c;">
            <div class="container py-3 text-center">
                © 2026 Salón de Belleza <br>
                Caso Práctico 1 <br>
                Ignacio Blanco
            </div>
        </footer>

    </body>
</html>
